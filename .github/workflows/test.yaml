name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The core has no dependencies; these tests need no backend SDK or key.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: python -m pytest -v tests/test_core.py

  gemini:
    # The ADK runner tests stub the model, so no GOOGLE_API_KEY is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gemini,dev]"
      - run: python -m pytest -v tests/test_adk.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black
      - run: black --check --diff .
